<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Football Buddy ⚽</title>
  <style>
    :root {
      --bg: #0b3d1e;
      --pitch: #0f5128;
      --line: rgba(255,255,255,0.15);
      --card: #ffffff;
      --text: #1a1a1a;
      --me: #16a34a;
      --bot: #f1f5f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, var(--pitch), var(--bg));
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .app {
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 32px);
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    }
    header {
      background: var(--me);
      color: white;
      padding: 16px 20px;
    }
    header h1 { margin: 0; font-size: 1.3rem; }
    header p { margin: 4px 0 0; font-size: 0.9rem; opacity: 0.9; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
      color: var(--text);
    }
    .me { align-self: flex-end; background: var(--me); color: white; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
    .error { align-self: center; background: #fee2e2; color: #991b1b; font-size: 0.9rem; }
    form {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #e5e7eb;
    }
    input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 1rem;
    }
    input:focus { outline: 2px solid var(--me); border-color: transparent; }
    button {
      padding: 0 18px;
      border: 0;
      border-radius: 10px;
      background: var(--me);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>⚽ Football Buddy</h1>
      <p>Ask me anything about football — players, clubs, tactics, history.</p>
    </header>

    <div id="chat">
      <div class="msg bot">Hi! I only talk football. Who's the best striker you've ever seen? 😄</div>
    </div>

    <form id="form">
      <input id="input" type="text" placeholder="Type your football question…" autocomplete="off" required />
      <button id="send" type="submit">Send</button>
    </form>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    // The conversation so far (sent to the server each time so the bot remembers context)
    const history = [];

    function addMessage(text, who) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "me");
      history.push({ role: "user", content: text });
      input.value = "";
      sendBtn.disabled = true;

      const thinking = addMessage("Thinking… ⚽", "bot");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        thinking.remove();

        if (!res.ok) {
          addMessage("Error: " + (data.error || "Something went wrong."), "error");
          history.pop(); // forget the failed question
        } else {
          addMessage(data.reply, "bot");
          history.push({ role: "assistant", content: data.reply });
        }
      } catch (err) {
        thinking.remove();
        addMessage("Error: could not reach the server.", "error");
        history.pop();
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
